configuration:
  serial_port:
    name: Serial port
    description: The USB-RS485 adapter wired to the controller's G1 bus. Pick the /dev/serial/by-id entry so it survives reboots.
  log_level:
    name: Log level
  clock_sync:
    name: Panel clock sync
    description: Sets the panel clock from Home Assistant once a day and after DST changes.
network:
  8000/tcp: Gateway REST API. The ecoNEXT integration connects here.
