name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Build package
        run: uv build

      - name: Create install bundle
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          WHEEL=$(ls dist/*.whl)
          mkdir -p bundle/deploy
          cp "$WHEEL" bundle/
          cp deploy/install.sh bundle/deploy/
          cp deploy/99-econext.rules bundle/deploy/
          cp deploy/econext-gateway.service bundle/deploy/
          tar -czf "dist/gateway-bundle-${VERSION}.tar.gz" -C bundle .
          rm -f dist/econext_gateway-*.tar.gz

      - name: Detect pre-release
        id: prerelease
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          if [[ "$VERSION" =~ (a|b|rc)[0-9]+ ]]; then
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          # CHANGELOG.md section: everything between "## [VERSION]" and the next "## [" heading.
          awk -v v="$VERSION" '
            /^## \[/ { if (found) exit; found = ($0 ~ "^## \\[" v "\\]") ; next }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [[ ! -s release-notes.md ]]; then
            echo "No CHANGELOG.md entry for ${VERSION}; using generated notes only."
          fi
          # Generated notes (merged PRs, compare link) against the latest stable
          # release, not the most recent pre-release.
          PREV=$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq .tag_name 2>/dev/null || true)
          echo "Generating notes against previous release: ${PREV:-<none>}"
          gh api -X POST "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
            -f tag_name="v${VERSION}" \
            ${PREV:+-f previous_tag_name="$PREV"} \
            --jq .body >> release-notes.md

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          prerelease: ${{ steps.prerelease.outputs.is_prerelease == 'true' }}
          files: |
            dist/*.whl
            dist/gateway-bundle-*.tar.gz
